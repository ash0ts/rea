[project]
name = "rea-forge-recovery"
version = "0.1.0"
description = "A source-withheld Piskel recovery experiment with REA"
requires-python = ">=3.11"
dependencies = ["pillow==13.0.0", "playwright==1.64.1"]

[project.optional-dependencies]
test = ["pytest==9.2.0"]
forge = ["weave==0.54.1", "wandb==0.31.0", "openai==3.46.0", "mcp==2.3.0"]
notebooks = ["marimo==0.25.2", "wandb==0.31.0"]

[project.scripts]
forge-recovery = "forge_recovery.cli:main"

[build-system]
requires = ["hatchling==1.30.1"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forge_recovery"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
